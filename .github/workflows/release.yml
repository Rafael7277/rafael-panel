name: Build Rafael Panel Release

on:
  push:
    branches:
      - main
    tags:
      - "v59"

permissions:
  contents: read

jobs:
  linux-amd64:
    name: Package Linux amd64 release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: third_party/xray-core/go.mod
          cache-dependency-path: |
            go.sum
            third_party/xray-core/go.sum
          cache: true

      - name: Build and package Rafael Panel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-v59/rafael/bin
          export CGO_ENABLED=0 GOOS=linux GOARCH=amd64
          go build -mod=mod -trimpath -ldflags "-s -w" -o build-v59/rafael/rafael-panel .

          cp bootstrap.sh install-local.sh rafael.sh rafael.service.debian \
            rafael-updater.sh rafael-launcher.sh LICENSE NOTICE \
            README-v59.md RELEASE_NOTES_v59.md BUILD_V59_CHECKLIST.md \
            xray-fork-version.txt build-v59/rafael/

          updater_hash="$(sha256sum build-v59/rafael/rafael-updater.sh | awk '{print $1}')"
          test "$(grep -c 'BOOTSTRAP_UPDATER_SHA256=""' build-v59/rafael/rafael.sh)" = "1"
          sed -i "s/BOOTSTRAP_UPDATER_SHA256=\"\"/BOOTSTRAP_UPDATER_SHA256=\"${updater_hash}\"/" \
            build-v59/rafael/rafael.sh

          source_pin="$(sed -n 's/^source_sha256=//p' xray-fork-version.txt)"
          fork_commit="$(sed -n 's/^fork_base_commit=//p' xray-fork-version.txt)"
          [[ "${source_pin}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${fork_commit}" =~ ^[0-9a-f]{40}$ ]]
          [[ -f third_party/xray-core/app/iplimit/tracker.go ]]
          grep -Fq 'RAFAEL:IPLIMIT' third_party/xray-core/app/dispatcher/default.go
          : > build-v59/xray-source.manifest
          while IFS= read -r -d '' file; do
            relative="${file#third_party/xray-core/}"
            printf '%s  %s\n' "${relative}" "$(sha256sum "${file}" | cut -d' ' -f1)" \
              >> build-v59/xray-source.manifest
          done < <(find third_party/xray-core -type f -print0 | LC_ALL=C sort -z)
          actual_source_pin="$(sha256sum build-v59/xray-source.manifest | awk '{print $1}')"
          test "${actual_source_pin}" = "${source_pin}"
          (
            cd third_party/xray-core
            xray_build_id="rafael-iplimit-${fork_commit:0:7}-${source_pin:0:12}"
            go build -trimpath -buildvcs=false \
              -ldflags "-s -w -X github.com/xtls/xray-core/core.build=${xray_build_id}" \
              -o ../../build-v59/rafael/bin/xray-linux-amd64 ./main
          )
          cp build-v59/rafael/bin/xray-linux-amd64 build-v59/rafael-xray-linux-amd64
          chmod 755 build-v59/rafael-xray-linux-amd64
          (cd build-v59 && sha256sum rafael-xray-linux-amd64 > rafael-xray-linux-amd64.sha256)
          curl -fL --retry 3 \
            https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat \
            -o build-v59/rafael/bin/geoip.dat
          curl -fL --retry 3 \
            https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat \
            -o build-v59/rafael/bin/geosite.dat
          tar -czf build-v59/rafael-xray-core-source.tar.gz -C third_party xray-core
          (cd build-v59 && sha256sum rafael-xray-core-source.tar.gz > rafael-xray-core-source.tar.gz.sha256)

          marker="$(sed -n 's/^CLI_BUILD_VERSION="\([^"]*\)"$/\1/p' build-v59/rafael/rafael.sh)"
          test "${marker}" = "v59"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            test "${GITHUB_REF_NAME}" = "${marker}"
          else
            test "${GITHUB_REF_TYPE}" == "branch"
          fi
          grep -Fq "BOOTSTRAP_UPDATER_SHA256=\"${updater_hash}\"" build-v59/rafael/rafael.sh
          tar -czf build-v59/rafael-linux-amd64.tar.gz -C build-v59 rafael
          tar -tzf build-v59/rafael-linux-amd64.tar.gz | grep -Fxq rafael/install-local.sh
          tar -tzf build-v59/rafael-linux-amd64.tar.gz | grep -Fxq rafael/bin/xray-linux-amd64
          tar -tzf build-v59/rafael-linux-amd64.tar.gz | grep -Fxq rafael/xray-fork-version.txt
          tar -tzf build-v59/rafael-xray-core-source.tar.gz | grep -Fxq xray-core/app/iplimit/tracker.go
          tar -tzf build-v59/rafael-xray-core-source.tar.gz | grep -Fxq xray-core/LICENSE
          (cd build-v59 && sha256sum rafael-linux-amd64.tar.gz > rafael-linux-amd64.tar.gz.sha256)

      - name: Upload commit package artifact
        uses: actions/upload-artifact@v4
        with:
          name: rafael-linux-amd64-${{ github.ref_name }}
          path: |
            build-v59/rafael-linux-amd64.tar.gz
            build-v59/rafael-linux-amd64.tar.gz.sha256
            build-v59/rafael-xray-linux-amd64
            build-v59/rafael-xray-linux-amd64.sha256
            build-v59/rafael-xray-core-source.tar.gz
            build-v59/rafael-xray-core-source.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Rafael Panel ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: false
          files: |
            build-v59/rafael-linux-amd64.tar.gz
            build-v59/rafael-linux-amd64.tar.gz.sha256
            build-v59/rafael-xray-linux-amd64
            build-v59/rafael-xray-linux-amd64.sha256
            build-v59/rafael-xray-core-source.tar.gz
            build-v59/rafael-xray-core-source.tar.gz.sha256
            README-v59.md
            RELEASE_NOTES_v59.md
            BUILD_V59_CHECKLIST.md
            LICENSE
            NOTICE
