{{define "component/sidebar/content"}}
<template>
    <div class="ant-sidebar">
        <a-button class="rafael-mobile-menu-trigger" aria-label="Open navigation menu" @click="toggleDrawer">
            <a-icon :type="visible ? 'close' : 'menu'"></a-icon>
        </a-button>
        <a-layout-sider :theme="themeSwitcher.currentTheme" :width="236" :collapsed-width="72" collapsible :collapsed="collapsed"
            @collapse="(isCollapsed, type) => collapseHandle(isCollapsed, type)" breakpoint="md">
            <div class="rafael-brand">
                <span class="rafael-brand-mark" aria-label="Rafael"><svg viewBox="0 0 40 40" role="img"><path d="M5 30 17.4 8h8L18.6 20h14.8L22.7 34h-9.1l6.3-9H5z" fill="url(#rafael-mark-gradient)"/><path d="M21.4 20h9.1l-5 8.7h-9.1z" fill="#a77cff"/><defs><linearGradient id="rafael-mark-gradient" x1="5" y1="8" x2="34" y2="34" gradientUnits="userSpaceOnUse"><stop stop-color="#b06cff"/><stop offset="1" stop-color="#6f35eb"/></linearGradient></defs></svg></span>
                <span class="rafael-brand-copy"><strong>Rafael</strong><small>CONTROL PANEL</small></span>
            </div>
            <a-theme-switch></a-theme-switch>
            <div v-if="portalIsReseller && portalUsername" style="padding: 6px 16px 2px 16px;">
                <a-tag color="cyan" style="margin-right: 0; width: 100%; text-align: center;" v-text="portalUsername"></a-tag>
            </div>
            <a-menu :theme="themeSwitcher.currentTheme" mode="inline" :selected-keys="activeTab"
                @click="({key}) => openLink(key)">
                <a-menu-item v-for="tab in tabs" :key="tab.key">
                    <a-icon :type="tab.icon"></a-icon>
                    <span v-text="tab.title"></span>
                </a-menu-item>
            </a-menu>
        </a-layout-sider>
        <a-drawer placement="left" :width="288" :closable="false" @close="closeDrawer" :visible="visible"
            :wrap-class-name="themeSwitcher.currentTheme + ' rafael-mobile-drawer'" :wrap-style="{ padding: 0 }" :style="{ height: '100%' }">
            <div class="rafael-brand">
                <span class="rafael-brand-mark" aria-label="Rafael"><svg viewBox="0 0 40 40" role="img"><path d="M5 30 17.4 8h8L18.6 20h14.8L22.7 34h-9.1l6.3-9H5z" fill="url(#rafael-mark-gradient)"/><path d="M21.4 20h9.1l-5 8.7h-9.1z" fill="#a77cff"/><defs><linearGradient id="rafael-mark-gradient" x1="5" y1="8" x2="34" y2="34" gradientUnits="userSpaceOnUse"><stop stop-color="#b06cff"/><stop offset="1" stop-color="#6f35eb"/></linearGradient></defs></svg></span>
                <span class="rafael-brand-copy"><strong>Rafael</strong><small>CONTROL PANEL</small></span>
            </div>
            <a-theme-switch></a-theme-switch>
            <div v-if="portalIsReseller && portalUsername" style="padding: 6px 16px 2px 16px;">
                <a-tag color="cyan" style="margin-right: 0; width: 100%; text-align: center;" v-text="portalUsername"></a-tag>
            </div>
            <a-menu :theme="themeSwitcher.currentTheme" mode="inline" :selected-keys="activeTab"
                @click="({key}) => openLink(key)">
                <a-menu-item v-for="tab in tabs" :key="tab.key">
                    <a-icon :type="tab.icon"></a-icon>
                    <span v-text="tab.title"></span>
                </a-menu-item>
            </a-menu>
        </a-drawer>
    </div>
</template>
{{end}}

{{define "component/aSidebar"}}
<style>
    .ant-sidebar>.ant-layout-sider {
        height: 100%;
    }

</style>

<script>
    const SIDEBAR_COLLAPSED_KEY = "isSidebarCollapsed"

    Vue.component('a-panel-topbar', {
        props: { title: { type: String, default: '' }, subtitle: { type: String, default: '' } },
        template: `<header class="rafael-topbar">
            <div class="rafael-topbar-heading">
                <div class="rafael-topbar-eyebrow">RAFAEL / CONTROL CENTER</div>
                <h1 v-text="title"></h1>
                <p v-if="subtitle" v-text="subtitle"></p>
            </div>
            <div class="rafael-topbar-profile">
                <span class="rafael-secure-pill"><i></i> Control panel</span>
                <span class="rafael-topbar-avatar">R</span>
            </div>
        </header>`
    });

    Vue.component('a-sidebar', {
        data() {
            const isAdmin = {{ if .login_is_admin }}true{{ else }}false{{ end }};
            const roleName = '{{ .login_role_name }}' || 'admin';
            let permissionMap = { overview: true, inbounds: true, multiLinks: true };
            try {
                permissionMap = Object.assign(permissionMap, JSON.parse({{ .login_permissions }} || '{}'));
            } catch (e) {}
            const allTabs = [
                {
                    key: '{{ .panel_path }}',
                    icon: 'dashboard',
                    title: '{{ i18n "menu.dashboard"}}',
                    visible: isAdmin || permissionMap.overview
                },
                {
                    key: '{{ .panel_path }}inbounds',
                    icon: 'user',
                    title: '{{ i18n "menu.inbounds"}}',
                    visible: isAdmin || permissionMap.inbounds
                },
                {
                    key: '{{ .panel_path }}nodes',
                    icon: 'api',
                    title: 'Nodes',
                    visible: isAdmin
                },
                {
                    key: '{{ .panel_path }}multilinks',
                    icon: 'link',
                    title: 'Multi link',
                    visible: isAdmin || permissionMap.multiLinks
                },
                {
                    key: '{{ .panel_path }}resellers',
                    icon: 'team',
                    title: 'Resellers',
                    visible: isAdmin
                },
                {
                    key: '{{ .panel_path }}settings',
                    icon: 'setting',
                    title: '{{ i18n "menu.settings"}}',
                    visible: isAdmin
                },
                {
                    key: '{{ .panel_path }}xray',
                    icon: 'tool',
                    title: '{{ i18n "menu.xray"}}',
                    visible: isAdmin
                },
                {
                    key: '{{ .logout_path }}',
                    icon: 'logout',
                    title: '{{ i18n "menu.logout"}}',
                    visible: true
                },
            ];
            return {
                tabs: allTabs.filter(tab => tab.visible),
                activeTab: [
                    '{{ .request_uri }}'
                ],
                visible: false,
                collapsed: JSON.parse(localStorage.getItem(SIDEBAR_COLLAPSED_KEY)),
                roleName,
                portalUsername: {{ .portal_username }},
                portalIsReseller: {{ if .portal_is_reseller }}true{{ else }}false{{ end }},
                loginIsAdmin: isAdmin,
            }
        },
        methods: {
            openLink(key) {
                return key.startsWith('http') ? 
                    window.open(key) : 
                    location.href = key
            },
            closeDrawer() {
                this.visible = false;
            },
            toggleDrawer() {
                this.visible = !this.visible;
            },
            collapseHandle(collapsed, type) {
                if (type === "clickTrigger") {
                    localStorage.setItem(SIDEBAR_COLLAPSED_KEY, collapsed);

                    this.collapsed = JSON.parse(localStorage.getItem(SIDEBAR_COLLAPSED_KEY));
                }
            }
        },
        template: `{{template "component/sidebar/content"}}`,
    });
</script>
{{end}}
