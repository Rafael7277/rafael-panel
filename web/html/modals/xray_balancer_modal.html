{{define "modals/balancerModal"}}
<a-modal 
    id="balancer-modal"
    v-model="balancerModal.visible"
    :title="balancerModal.title"
    @ok="balancerModal.ok"
    :confirm-loading="balancerModal.confirmLoading"
    :ok-button-props="{ props: { disabled: !balancerModal.isValid } }"
    :closable="true"
    :mask-closable="false"
    :ok-text="balancerModal.okText"
    cancel-text='{{ i18n "close" }}'
    :class="themeSwitcher.currentTheme"
    wrap-class-name="rafael-xray-form-modal">
    <a-form :colon="false" :label-col="{ md: {span:8} }" :wrapper-col="{ md: {span:14} }">
        <a-form-item label='{{ i18n "pages.xray.balancer.tag" }}' has-feedback
            :validate-status="balancerModal.duplicateTag? 'warning' : 'success'">
            <a-input v-model.trim="balancerModal.balancer.tag" @change="balancerModal.check()"
                placeholder='{{ i18n "pages.xray.balancer.tagDesc" }}'></a-input>
        </a-form-item>
        <a-form-item label='{{ i18n "pages.xray.balancer.balancerStrategy" }}'>
            <a-select v-model="balancerModal.balancer.strategy" :dropdown-class-name="themeSwitcher.currentTheme">
                <a-select-option value="random">Random</a-select-option>
                <a-select-option value="roundRobin">Round Robin</a-select-option>
                <a-select-option value="leastLoad">Least Load</a-select-option>
                <a-select-option value="leastPing">Least Ping</a-select-option>
                <a-select-option value="adaptiveSmart">Adaptive Smart</a-select-option>
            </a-select>
        </a-form-item>
        <a-form-item label='{{ i18n "pages.xray.balancer.balancerSelectors" }}' has-feedback
            :validate-status="balancerModal.emptySelector? 'warning' : 'success'">
            <a-select v-model="balancerModal.balancer.selector" mode="tags" @change="balancerModal.checkSelector()"
                :dropdown-class-name="themeSwitcher.currentTheme">
                <a-select-option v-for="tag in balancerModal.outboundTags" :value="tag">[[ tag ]]</a-select-option>
            </a-select>
        </a-form-item>
        <a-form-item label="Fallback">
            <a-select v-model="balancerModal.balancer.fallbackTag" clearable
                :dropdown-class-name="themeSwitcher.currentTheme">
                <a-select-option v-for="tag in [ '', ...balancerModal.outboundTags]" :value="tag">[[ tag ]]</a-select-option>
            </a-select>
        </a-form-item>
        <template v-if="balancerModal.balancer.strategy === 'adaptiveSmart'">
            <a-alert
                type="warning"
                show-icon
                :style="{ marginBottom: '16px' }"
                message="Adaptive Smart"
                description="Throughput probe is disabled by default. If enabled, it sends small test traffic periodically. Runtime traffic still uses the selected native Xray strategy, while adaptive health keeps trimming the eligible selector set.">
            </a-alert>
            <a-form-item label="Runtime Fallback Strategy">
                <a-select v-model="balancerModal.balancer.adaptiveSmart.fallbackStrategy" :dropdown-class-name="themeSwitcher.currentTheme">
                    <a-select-option value="leastLoad">Least Load</a-select-option>
                    <a-select-option value="roundRobin">Round Robin</a-select-option>
                    <a-select-option value="random">Random</a-select-option>
                </a-select>
            </a-form-item>
            <a-form-item label="Check Interval (sec)">
                <a-input-number v-model="balancerModal.balancer.adaptiveSmart.checkIntervalSec" :min="5" :step="1" style="width:100%;"></a-input-number>
            </a-form-item>
            <a-form-item label="Check Timeout (sec)">
                <a-input-number v-model="balancerModal.balancer.adaptiveSmart.checkTimeoutSec" :min="1" :step="1" style="width:100%;"></a-input-number>
            </a-form-item>
            <a-form-item label="Min Score">
                <a-input-number v-model="balancerModal.balancer.adaptiveSmart.minScore" :min="1" :max="100" style="width:100%;"></a-input-number>
            </a-form-item>
            <a-form-item label="Quarantine After Failures">
                <a-input-number v-model="balancerModal.balancer.adaptiveSmart.quarantineAfterFailures" :min="1" :step="1" style="width:100%;"></a-input-number>
            </a-form-item>
            <a-form-item label="Quarantine Duration (sec)">
                <a-input-number v-model="balancerModal.balancer.adaptiveSmart.quarantineDurationSec" :min="10" :step="10" style="width:100%;"></a-input-number>
            </a-form-item>
            <a-form-item label="Recovery Weight">
                <a-input-number v-model="balancerModal.balancer.adaptiveSmart.recoveryWeight" :min="1" :step="1" style="width:100%;"></a-input-number>
            </a-form-item>
            <a-form-item label="Enable Throughput Probe">
                <a-switch v-model="balancerModal.balancer.adaptiveSmart.enableThroughputProbe"></a-switch>
            </a-form-item>
            <a-form-item label="Throughput Probe Size KB">
                <a-input-number v-model="balancerModal.balancer.adaptiveSmart.throughputProbeSizeKB" :min="16" :step="16" style="width:100%;"></a-input-number>
            </a-form-item>
            <a-form-item label="Throughput Probe Interval (sec)">
                <a-input-number v-model="balancerModal.balancer.adaptiveSmart.throughputProbeIntervalSec" :min="30" :step="10" style="width:100%;"></a-input-number>
            </a-form-item>
            <a-form-item label="Debug Mode">
                <a-switch v-model="balancerModal.balancer.adaptiveSmart.debug"></a-switch>
            </a-form-item>
        </template>
    </a-form>
</a-modal>
<script>
    function defaultAdaptiveSmartSettings() {
        return {
            enabled: true,
            fallbackStrategy: 'leastLoad',
            checkIntervalSec: 20,
            checkTimeoutSec: 3,
            minScore: 40,
            quarantineAfterFailures: 3,
            quarantineDurationSec: 60,
            recoveryWeight: 10,
            enableThroughputProbe: false,
            throughputProbeSizeKB: 128,
            throughputProbeIntervalSec: 180,
            debug: false,
            strictMode: false,
        };
    }

    const balancerModal = {
        title: '',
        visible: false,
        confirmLoading: false,
        okText: '{{ i18n "sure" }}',
        isEdit: false,
        confirm: null,
        duplicateTag: false,
        emptySelector: false,
        balancer: {
            tag: '',
            strategy: 'random',
            selector: [],
            fallbackTag: '',
            adaptiveSmart: defaultAdaptiveSmartSettings(),
        },
        outboundTags: [],
        balancerTags:[],
        ok() {
            if (balancerModal.balancer.selector.length == 0) {
                balancerModal.emptySelector = true;
                return;
            }
            balancerModal.emptySelector = false;
            ObjectUtil.execute(balancerModal.confirm, balancerModal.balancer);
        },
        show({ title = '', okText = '{{ i18n "sure" }}', balancerTags = [], balancer, confirm = (balancer) => { }, isEdit = false }) {
            this.title = title;
            this.okText = okText;
            this.confirm = confirm;
            this.visible = true;
            if (isEdit) {
                balancerModal.balancer = balancer;
            } else {
                balancerModal.balancer = {
                    tag: '',
                    strategy: 'random',
                    selector: [],
                    fallbackTag: '',
                    adaptiveSmart: defaultAdaptiveSmartSettings(),
                };
            }
            balancerModal.balancer.adaptiveSmart = Object.assign(defaultAdaptiveSmartSettings(), balancerModal.balancer.adaptiveSmart || {});
            this.balancerTags = balancerTags.filter((tag) => tag != balancer.tag);
            this.outboundTags = app.templateSettings.outbounds.filter((o) => !ObjectUtil.isEmpty(o.tag)).map(obj => obj.tag);
            this.isEdit = isEdit;
            this.check();
            this.checkSelector();
        },
        close() {
            this.visible = false;
            this.loading(false);
        },
        loading(loading=true) {
            this.confirmLoading = loading;
        },
        check() {
            if (this.balancer.tag == '' || this.balancerTags.includes(this.balancer.tag)) {
                this.duplicateTag = true;
                this.isValid = false;
            } else {
                this.duplicateTag = false;
                this.isValid = true;
            }
        },
        checkSelector() {
            this.emptySelector = this.balancer.selector.length == 0;
        }
    };

    new Vue({
        delimiters: ['[[', ']]'],
        el: '#balancer-modal',
        data: {
            balancerModal: balancerModal
        },
        methods: {
        }
    });

</script>
{{end}}
