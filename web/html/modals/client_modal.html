{{define "modals/clientsModal"}}
<a-modal id="client-modal" v-model="clientModal.visible"
    :title="clientModal.title" @ok="clientModal.ok"
    :confirm-loading="clientModal.confirmLoading" :closable="true"
    :mask-closable="false"
    :class="themeSwitcher.currentTheme"
    :ok-text="clientModal.okText" cancel-text='{{ i18n "close" }}'>
    <template v-if="isEdit">
        <a-tag v-if="isExpiry || isTrafficExhausted" color="orange"
            :style="{ marginBottom: '10px', display: 'block', textAlign: 'center' }">Account
            is Finished and Disabled</a-tag>
    </template>
    {{template "form/client"}}
</a-modal>
<script>

    const clientModal = {
        visible: false,
        confirmLoading: false,
        title: '',
        okText: '',
        isEdit: false,
        dbInbound: new DBInbound(),
        inbound: new Inbound(),
        clients: [],
        clientStats: [],
        oldClientId: "",
        index: null,
        clientIps: null,
        delayedStart: false,
        multiLink: false,
        selectedInboundIds: [],
        ok() {
            const currentClient = clientModalApp.client;
            if (!loginIsAdmin && currentClient && Number(currentClient._totalGB || 0) <= 0) {
                clientModalApp.$message.error('Resellers must assign a finite traffic amount of at least 0.1 GB.');
                return;
            }
            if (clientModal.isEdit) {
                ObjectUtil.execute(clientModal.confirm, clientModalApp.client, clientModal.dbInbound.id, clientModal.oldClientId);
            } else {
                const newClient = clientModalApp.client;
                const targetInboundId = clientModalApp.targetInboundId || clientModal.dbInbound.id;
                ObjectUtil.execute(clientModal.confirm, clientModalApp.client, targetInboundId, {
                    multiLink: clientModal.multiLink,
                    multiInboundIds: clientModal.selectedInboundIds,
                    clients: newClient ? [newClient] : [],
                });
            }
        },
        show({ title = '', okText = '{{ i18n "sure" }}', index = null, dbInbound = null, confirm = () => { }, isEdit = false }) {
            this.visible = true;
            this.title = title;
            this.okText = okText;
            this.isEdit = isEdit;
            this.dbInbound = new DBInbound(dbInbound);
            this.inbound = Inbound.fromJson(dbInbound.toInbound().toJson());
            this.clients = this.inbound.clients;
            this.index = index === null ? this.clients.length : index;
            this.delayedStart = false;
            this.multiLink = false;
            this.selectedInboundIds = [dbInbound.id];
            if (isEdit) {
                if (this.clients[index].expiryTime < 0) {
                    this.delayedStart = true;
                }
                this.oldClientId = this.getClientId(dbInbound.protocol, clients[index]);
            } else {
                this.addClient(this.inbound, this.clients);
            }
            this.clientStats = this.dbInbound.clientStats.find(row => row.email === this.clients[this.index].email);
            this.confirm = confirm;
        },  
        getClientId(protocol, client) {
            switch (protocol) {
                case Protocols.TROJAN: return client.password;
                case Protocols.SHADOWSOCKS: return client.email;
                case Protocols.HYSTERIA: return client.auth;
                default: return client.id;
            }
        },
        addClient(inbound, clients) {
            switch (inbound.protocol) {
                case Protocols.VMESS: return clients.push(new Inbound.VmessSettings.VMESS());
                case Protocols.VLESS: return clients.push(new Inbound.VLESSSettings.VLESS());
                case Protocols.TROJAN: return clients.push(new Inbound.TrojanSettings.Trojan());
                case Protocols.SHADOWSOCKS: return clients.push(new Inbound.ShadowsocksSettings.Shadowsocks(clients[0].method, RandomUtil.randomShadowsocksPassword(inbound.settings.method)));
                case Protocols.HYSTERIA: return clients.push(new Inbound.HysteriaSettings.Hysteria());
                default: return null;
            }
        },
        close() {
            clientModal.visible = false;
            clientModal.loading(false);
        },
        loading(loading=true) {
            clientModal.confirmLoading = loading;
        },
    };

    const clientModalApp = new Vue({
        delimiters: ['[[', ']]'],
        el: '#client-modal',
        data: {
            clientModal,
            loginIsAdmin,
            get inbound() {
                return this.clientModal.inbound;
            },
            get client() {
                return this.clientModal.clients[this.clientModal.index];
            },
            get clientStats() {
                return this.clientModal.clientStats;
            },
            get availableMultiInbounds() {
                return app.dbInbounds
                    .filter(row => row && row.id > 0)
                    .filter(row => row.protocol === this.inbound.protocol)
                    .map(row => ({
                        label: `${row.remark || row.tag || ('Inbound #' + row.id)} (${row.protocol}@${row.port})`,
                        value: row.id,
                    }));
            },
            get targetInboundId() {
                return this.clientModal.selectedInboundIds.length > 0 ? this.clientModal.selectedInboundIds[0] : null;
            },
            set targetInboundId(value) {
                const nextId = Number(value || 0);
                if (!nextId) {
                    this.clientModal.selectedInboundIds = [];
                    return;
                }
                this.clientModal.selectedInboundIds = [nextId];
                const nextInbound = app.dbInbounds.find(row => row && row.id === nextId);
                if (nextInbound && nextInbound.protocol === this.clientModal.inbound.protocol) {
                    this.clientModal.dbInbound = new DBInbound(nextInbound);
                    this.clientModal.inbound = Inbound.fromJson(nextInbound.toInbound().toJson());
                    this.clientModal.clients = this.clientModal.inbound.clients;
                    this.clientModal.index = this.clientModal.clients.length;
                    this.clientModal.addClient(this.clientModal.inbound, this.clientModal.clients);
                }
            },
            get isEdit() {
                return this.clientModal.isEdit;
            },
            // Turning the switch off stores limitIp=0; existing positive limits
            // are shown as enabled when editing a client.
            get ipLimitSwitch() {
                return !!(this.client && Number(this.client.limitIp) > 0);
            },
            set ipLimitSwitch(on) {
                if (!this.client) return;
                if (on) {
                    if (Number(this.client.limitIp) <= 0) this.client.limitIp = 1;
                } else {
                    this.client.limitIp = 0;
                }
            },
            get datepicker() {
                return app.datepicker;
            },
            get isTrafficExhausted() {
                if (!this.clientStats) return false
                if (this.clientStats.total <= 0) return false
                if (this.clientStats.up + this.clientStats.down < this.clientStats.total) return false
                return true
            },
            get isExpiry() {
                return this.clientModal.isEdit && this.client.expiryTime >0 ? (this.client.expiryTime < new Date().getTime()) : false;
            },
            get delayedStart() {
                return this.clientModal.delayedStart;
            },
            set delayedStart(value) {
                this.clientModal.delayedStart = value;
            },
            get delayedExpireDays() {
                return this.client && this.client.expiryTime < 0 ? this.client.expiryTime / -86400000 : 0;
            },
            set delayedExpireDays(days) {
                this.client.expiryTime = -86400000 * days;
            },
        },
        methods: {
            async getDBClientIps(email) {
                const msg = await HttpUtil.post(`${panelApiPath}/inbounds/clientIps/${email}`);
                if (!msg.success) {
                    document.getElementById("clientIPs").value = msg.obj;
                    return;
                }
                let ips = msg.obj;
                if (typeof ips === 'string' && ips.startsWith('[') && ips.endsWith(']')) {
                    try {
                        ips = JSON.parse(ips);
                        ips = Array.isArray(ips) ? ips.join("\n") : ips;
                    } catch (e) {
                        console.error('Error parsing JSON:', e);
                    }
                }
                document.getElementById("clientIPs").value = ips;
            },
            async clearDBClientIps(email) {
                try {
                    const msg = await HttpUtil.post(`${panelApiPath}/inbounds/clearClientIps/${email}`);
                    if (!msg.success) {
                        return;
                    }
                    document.getElementById("clientIPs").value = "";
                } catch (error) {
                }
            },
            resetClientTraffic(email, dbInboundId, iconElement) {
                this.$confirm({
                    title: '{{ i18n "pages.inbounds.resetTraffic"}}',
                    content: '{{ i18n "pages.inbounds.resetTrafficContent"}}',
                    class: themeSwitcher.currentTheme,
                    okText: '{{ i18n "reset"}}',
                    cancelText: '{{ i18n "cancel"}}',
                    onOk: async () => {
                        iconElement.disabled = true;
                        const msg = await HttpUtil.postWithModal(`${panelApiPath}/inbounds/` + dbInboundId + '/resetClientTraffic/' + email);
                        if (msg.success) {
                            this.clientModal.clientStats.up = 0;
                            this.clientModal.clientStats.down = 0;
                        }
                        iconElement.disabled = false;
                    },
                })
            },
        },
    });

</script>
{{end}}
